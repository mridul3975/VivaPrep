services:
  - type: web
    name: repoviva
    runtime: docker
    plan: free
    numInstances: 1
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: VACHANA_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: DAILY_QUESTION_LIMIT
        value: "10"
      - key: DAILY_REVIEW_LIMIT
        value: "30"
      - key: DAILY_TRANSCRIPTION_LIMIT
        value: "10"
